name: Kontroll

# Körs på varje push och varje pull request mot main. Det som kontrolleras är
# detsamma som ska gå igenom lokalt: typer, tester och produktionsbygget.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  kontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite är experimentellt och kräver flaggan --experimental-sqlite
          # på Node 22. Versionen är låst, eftersom databasen byggs med den.
          node-version: "22"
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Typkontroll
        run: npm run typecheck

      - name: Tester
        run: npm test

      - name: Seeda databasen
        # Seedningen är en del av bygget i praktiken: går den inte igenom går
        # produkten inte att demonstrera.
        run: npm run db:reset

      - name: Produktionsbygge
        run: npm run build
