name: Kontroll

# Det som kontrolleras är detsamma som ska gå igenom lokalt: typer, tester och
# produktionsbygget.
#
# Push bara på main, och pull request för allt annat. Hade push gällt alla
# grenar skulle varje commit på en gren med öppen pull request kontrolleras
# två gånger.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  kontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite är experimentellt och kräver flaggan --experimental-sqlite
          # på Node 22. Versionen är låst, eftersom databasen byggs med den.
          node-version: "22"
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Typkontroll
        run: npm run typecheck

      - name: Tester
        run: npm test

      - name: Seeda databasen
        # Seedningen är en del av bygget i praktiken: går den inte igenom går
        # produkten inte att demonstrera.
        run: npm run db:reset

      - name: Produktionsbygge
        run: npm run build
